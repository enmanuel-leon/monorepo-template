# SonarQube / SonarCloud configuration for monorepo-app-template
sonar.projectKey=monorepo-app-template
sonar.organization=entropy-complex
sonar.projectName=monorepo-app-template
sonar.projectVersion=1.0.0

# Path is relative to the sonar-project.properties file
sonar.sources=.

# Path to the JavaScript/TypeScript LCOV coverage report
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# General exclusions (files excluded from static analysis)
sonar.exclusions=**/node_modules/**, dist/**, build/**, openwiki/**, coverage/**

# Coverage exclusions (files excluded from code coverage calculations)
sonar.coverage.exclusions=apps/web/**, **/tests/**, **/scripts/**, dist/**, *.config.ts, .commitlintrc.json, apps/api/src/server.ts, apps/api/src/services/email/templates/**, apps/api/src/constants/**, apps/api/src/plugins/**, apps/api/src/config/**

sonar.sourceEncoding=UTF-8
